site_name: Optical Intelligence

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Articles:
    - blog/index.md
  - About: index.md
  
plugins:
  - search
  - blog:
      post_dir: blog/posts
      archive: true
      categories: true
      post_excerpt: required
