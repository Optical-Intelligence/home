site_name: Optical Intelligence
site_url: https://optical-intelligence.github.io/home/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/share.js

extra_css:
  - stylesheets/share.css

# Adds the shared disclaimer to every Markdown page during the site build.
# Edit hooks/disclaimer.py to update it site-wide.
hooks:
  - hooks/disclaimer.py

extra:
  analytics:
    provider: google
    property: G-0WKP8WZJGT

nav:
  - Articles:
    - blog/index.md
  - About: index.md
  
plugins:
  - search
  - blog:
      post_dir: blog/posts
      archive: true
      categories: true
      post_excerpt: required
